<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - VIVA MENTE</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <main class="login-container">

        <!-- LOGO -->
        <section class="login-brand">

            <div class="login-logo">
                <i class="fas fa-brain"></i>
            </div>

            <h1>VIVA MENTE</h1>

            <p>Gestão Cognitiva</p>

        </section>


        <!-- ETAPA 1: ESCOLHER PERFIL -->
        <section
            id="login-choice"
            class="login-card"
        >

            <h2>Como deseja entrar?</h2>

            <p class="login-subtitle">
                Selecione o seu tipo de acesso
            </p>


            <div class="login-options">

                <button
                    type="button"
                    class="login-option login-medico"
                    onclick="selectLoginType('medico')"
                >

                    <div class="login-option-icon">
                        <i class="fas fa-user-doctor"></i>
                    </div>

                    <div class="login-option-content">

                        <h3>Entrar como Médico</h3>

                        <p>
                            Acesse o painel clínico e gerencie seus pacientes.
                        </p>

                    </div>

                    <i class="fas fa-chevron-right login-arrow"></i>

                </button>


                <button
                    type="button"
                    class="login-option login-cuidador"
                    onclick="selectLoginType('cuidador')"
                >

                    <div class="login-option-icon">
                        <i class="fas fa-user-nurse"></i>
                    </div>

                    <div class="login-option-content">

                        <h3>Entrar como Cuidador</h3>

                        <p>
                            Acompanhe a rotina e os cuidados do paciente.
                        </p>

                    </div>

                    <i class="fas fa-chevron-right login-arrow"></i>

                </button>

            </div>

        </section>


        <!-- ETAPA 2: USUÁRIO E SENHA -->
        <section
            id="login-form-area"
            class="login-card login-hidden"
        >

            <button
                type="button"
                class="login-back"
                onclick="backToChoice()"
            >
                <i class="fas fa-arrow-left"></i>
                Voltar
            </button>


            <div class="login-selected-profile">

                <div
                    id="login-selected-icon"
                    class="login-selected-icon"
                >
                </div>

                <div>

                    <span>Entrando como</span>

                    <h2
                        id="login-selected-name"
                    >
                    </h2>

                </div>

            </div>


            <form
                class="login-form"
                onsubmit="doLogin(event)"
            >

                <div class="login-field">

                    <label for="usuario">
                        Usuário
                    </label>

                    <div class="login-input-wrapper">

                        <i class="fas fa-user"></i>

                        <input
                            type="text"
                            id="usuario"
                            required
                            placeholder="Digite seu usuário"
                        >

                    </div>

                </div>


                <div class="login-field">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="login-input-wrapper">

                        <i class="fas fa-lock"></i>

                        <input
                            type="password"
                            id="senha"
                            required
                            placeholder="Digite sua senha"
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-submit"
                >

                    <span>Entrar</span>

                    <i class="fas fa-arrow-right"></i>

                </button>

            </form>

        </section>

    </main>


    <script>

        let loginType = "";

        function selectLoginType(type) {

            loginType = type;

            const choice =
                document.getElementById("login-choice");

            const form =
                document.getElementById("login-form-area");

            const name =
                document.getElementById("login-selected-name");

            const icon =
                document.getElementById("login-selected-icon");


            choice.classList.add("login-hidden");

            form.classList.remove("login-hidden");


            if (type === "medico") {

                name.innerText = "Médico";

                icon.innerHTML =
                    '<i class="fas fa-user-doctor"></i>';

                icon.className =
                    "login-selected-icon login-medico-color";

            } else {

                name.innerText = "Cuidador";

                icon.innerHTML =
                    '<i class="fas fa-user-nurse"></i>';

                icon.className =
                    "login-selected-icon login-cuidador-color";

            }

        }


        function backToChoice() {

            document
                .getElementById("login-form-area")
                .classList
                .add("login-hidden");


            document
                .getElementById("login-choice")
                .classList
                .remove("login-hidden");


            document
                .getElementById("usuario")
                .value = "";


            document
                .getElementById("senha")
                .value = "";


            loginType = "";

        }


        function doLogin(event) {

            event.preventDefault();


            const usuario =
                document
                    .getElementById("usuario")
                    .value
                    .trim();


            const senha =
                document
                    .getElementById("senha")
                    .value
                    .trim();


            if (!usuario || !senha) {

                return;

            }


            sessionStorage.setItem(
                "vivamenteUserType",
                loginType
            );


            sessionStorage.setItem(
                "vivamenteUserName",
                usuario
            );


            window.location.href =
                "index.html";

        }

    </script>

</body>
</html>
